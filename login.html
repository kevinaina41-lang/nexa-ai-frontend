<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - Nexa AI</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <img src="logo.png" alt="Nexa AI">
        </div>
        <h1>Nexa AI</h1>
        <p id="login-subtitle">Connectez-vous pour continuer</p>

        <form id="form-connexion" onsubmit="connexion(event)">
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
            <button type="submit">Se connecter</button>
        </form>

        <form id="form-inscription" onsubmit="inscription(event)" style="display:none">
            <input type="email" id="ins-email" placeholder="Email" required autocomplete="email">
            <input type="text" id="ins-nom" placeholder="Votre nom" required autocomplete="name">
            <input type="password" id="ins-password" placeholder="Mot de passe (min. 6 caractères)" required minlength="6" autocomplete="new-password">
            <input type="password" id="ins-password2" placeholder="Confirmer le mot de passe" required minlength="6" autocomplete="new-password">
            <button type="submit">Créer mon compte</button>
        </form>

        <p class="signup-link">
            <span id="texte-bascule">Pas de compte ?</span>
            <a href="#" onclick="basculerFormulaire(event)" id="lien-bascule">S'inscrire</a>
        </p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
